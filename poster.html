<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Portfolio | Srinivasa Editz</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'DM Sans',sans-serif;
background:#f8f5ef;
color:#111;
}

.header{
padding:40px 8%;
display:flex;
justify-content:space-between;
align-items:center;
border-bottom:1px solid rgba(0,0,0,.1);
}

.logo{
font-family:'Cormorant Garamond',serif;
font-size:32px;
font-weight:700;
}

.back-btn{
text-decoration:none;
color:black;
padding:12px 24px;
border:1px solid #111;
border-radius:50px;
transition:.3s;
}

.back-btn:hover{
background:#111;
color:white;
}

.hero{
padding:80px 8%;
text-align:center;
}

.hero h1{
font-size:60px;
margin-bottom:15px;
}

.hero p{
font-size:18px;
opacity:.8;
}

.gallery{
padding:0 8% 100px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:30px;
}

.gallery img{
width:100%;
border-radius:20px;
cursor:pointer;
transition:.4s;
box-shadow:0 15px 35px rgba(0,0,0,.15);
}

.gallery img:hover{
transform:translateY(-8px);
}

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:12px;
}

.close{
position:absolute;
top:30px;
right:40px;
font-size:40px;
color:white;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">
<div class="logo">Srinivasa Editz</div>
<a href="index.html" class="back-btn">← Back</a>
</div>

<section class="hero">
<h1>Poster Design Portfolio</h1>
<p>A collection of posters created by Srinivasa Editz</p>
</section>

<div class="gallery">

<img src="images/posters/poster.jpeg" onclick="openImage(this.src)">
<img src="images/posters/poster1.png" onclick="openImage(this.src)">
<img src="images/posters/poster2.png" onclick="openImage(this.src)">
<img src="images/posters/poster3.png" onclick="openImage(this.src)">
<img src="images/posters/poster4.png" onclick="openImage(this.src)">
<img src="images/posters/poster5.png" onclick="openImage(this.src)">
<img src="images/posters/poster6.png" onclick="openImage(this.src)">
<img src="images/posters/poster7.png" onclick="openImage(this.src)">
<img src="images/posters/poster8.png" onclick="openImage(this.src)">
<img src="images/posters/poster9.png" onclick="openImage(this.src)">

</div>

<div class="lightbox" id="lightbox">
<span class="close" onclick="closeImage()">×</span>
<img id="preview">
</div>

<script>

function openImage(src){
document.getElementById("lightbox").style.display="flex";
document.getElementById("preview").src=src;
}

function closeImage(){
document.getElementById("lightbox").style.display="none";
}

</script>

</body>
</html>
